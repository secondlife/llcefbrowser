name: Build
on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
jobs:
  build:
    strategy:
      matrix:
        # macos-latest and ubuntu-22.04 added 2026-09-17: build-cmd.sh now
        # builds all three platforms (darwin64 since 2026-09-16, linux64
        # freshly added and not yet verified anywhere but here).
        #
        # ubuntu-22.04, not ubuntu-latest: the Viewer's own Linux CI targets
        # ubuntu-22.04 specifically (an older GCC/libstdc++ than whatever
        # ubuntu-latest currently resolves to). A package built with a newer
        # GCC can reference libstdc++ symbols (e.g. std::string's
        # _M_replace_cold, GCC 12+ only) that an older consumer's link step
        # can't find -- confirmed the hard way via a real Viewer Linux link
        # failure. Packages need to build on the *oldest* toolchain any real
        # consumer targets, never a newer one.
        os: [windows-2022, macos-latest, ubuntu-22.04]
        addrsize: ["64"]
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: secondlife/action-autobuild@v5
        with:
          addrsize: ${{ matrix.addrsize }}
  release:
    needs: build
    runs-on: [ubuntu-latest]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: secondlife/action-autobuild-release@v3
        with:
          public: true
