name: Build
on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
jobs:
  build:
    strategy:
      matrix:
        # macos-latest and ubuntu-latest added 2026-09-17: build-cmd.sh now
        # builds all three platforms (darwin64 since 2026-09-16, linux64
        # freshly added and not yet verified anywhere but here).
        os: [windows-2022, macos-latest, ubuntu-latest]
        addrsize: ["64"]
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: secondlife/action-autobuild@v5
        with:
          addrsize: ${{ matrix.addrsize }}
  release:
    needs: build
    runs-on: [ubuntu-latest]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: secondlife/action-autobuild-release@v3
        with:
          public: true
